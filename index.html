<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>晨霧森林</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0e1714;color:#f1ead8;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#center{display:flex;flex-direction:column;align-items:center;min-width:0}
.side{display:none;align-items:center;justify-content:center;padding:0 8px}
#stage{position:relative;line-height:0;border-radius:8px 8px 0 0;overflow:hidden;background:#000}
canvas{display:block;touch-action:none}
#topbtns{position:absolute;top:6px;left:6px;display:flex;gap:6px;line-height:1}
.mini-btn{font:inherit;font-size:12px;padding:4px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.4);background:rgba(18,28,24,.6);color:#f1ead8;cursor:pointer}
.mini-btn:hover{background:rgba(40,60,50,.8)}
#hud{background:linear-gradient(#2a3830,#18211c);border-top:2px solid #5d7e69;padding:6px 8px 0;line-height:1.2;width:100%}
#hudRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvbox{display:flex;align-items:center;gap:6px}
.lv{background:linear-gradient(#ffe08a,#e6a93a);color:#2a1d05;font-weight:900;border-radius:5px;padding:2px 7px;font-size:13px;border:1px solid #2b1d07}
.pname{font-size:13px;font-weight:700;white-space:nowrap}
.bars{flex:1 1 170px;display:flex;flex-direction:column;gap:3px;min-width:150px}
.bar{position:relative;height:15px;background:#0b110e;border:1px solid #000;border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s}
.bar.hp i{background:linear-gradient(#ff8a7e,#d8383f)}
.bar.mp i{background:linear-gradient(#86c0ff,#2f6fe0)}
.bar span{position:absolute;inset:0;font-size:10.5px;line-height:13px;text-align:center;color:#fff;text-shadow:0 1px 1px #000,0 0 2px #000;font-weight:700}
.bar em{position:absolute;left:5px;top:0;font-style:normal;font-size:10px;line-height:13px;font-weight:900;color:#fff;text-shadow:0 1px 1px #000}
.slots{display:flex;gap:5px}
.slot{position:relative;width:42px;height:38px;background:#0f1612;border:1px solid #5d7e69;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slot .k{position:absolute;top:1px;left:3px;font-size:9px;color:#d8cfb4;font-weight:700}
.slot .n{position:absolute;bottom:1px;right:3px;font-size:11px;font-weight:900;text-shadow:0 1px 1px #000}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*1turn),transparent 0)}
.slot.lack{border-color:#7a3b3b}
.slot.lack .ico{opacity:.45}
.pot{width:13px;height:17px;border-radius:4px 4px 7px 7px;border:1.5px solid #2b1d17;position:relative;margin-top:3px}
.pot:before{content:"";position:absolute;left:2px;top:-6px;width:6px;height:5px;background:#c9a46a;border:1.5px solid #2b1d17;border-radius:2px}
.pot.r{background:linear-gradient(#ff8a7e,#c82f36)}
.pot.b{background:linear-gradient(#86c0ff,#2459c4)}
.wind{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#e9fffb,#4cc7b0 60%,#1d6b5f);border:1.5px solid #12322c;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#0e2a25}
.coins{font-size:13px;display:flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4b8,#f3c45a 55%,#b47a16);border:1.5px solid #5a3a06}
#expbar{position:relative;height:13px;margin:6px -8px 0;background:#0b110e;border-top:1px solid #000}
#expbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#fff0a8,#e0a92a);transition:width .2s}
#expbar span{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 1px #000,0 0 2px #000}
#bottomCtl{display:none;justify-content:space-between;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));width:100%;gap:8px}
.pad{--c:min(54px,calc((100vw - 64px)/6));display:grid;gap:6px;touch-action:none}
#dpad{grid-template-columns:repeat(3,var(--c));grid-template-rows:repeat(2,var(--c))}
#acts{grid-template-columns:repeat(3,calc(var(--c)*1.05));grid-template-rows:repeat(2,var(--c))}
.tb{font:inherit;font-weight:800;font-size:14px;border-radius:12px;border:1.5px solid #6f917b;background:rgba(40,58,48,.85);color:#f1ead8;touch-action:none;padding:0;-webkit-user-select:none;user-select:none}
.tb.on{background:#e6a93a;color:#2a1d05;border-color:#ffe08a}
.tb.big{background:rgba(70,92,60,.9)}
.side .pad{--c:min(58px,15vh)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,14,12,.66);z-index:10;padding:16px}
.ov.show{display:flex}
.card{background:linear-gradient(#2c3d33,#1a241f);border:2px solid #6f917b;border-radius:14px;padding:18px 20px;max-width:440px;width:100%;max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.55);text-align:center;line-height:1.5}
.card h1{margin:0;font-size:30px;color:#f3c45a;letter-spacing:6px;text-shadow:0 2px 0 #5a3a06}
.card h2{margin:0 0 6px;font-size:28px;color:#ff8a7e;letter-spacing:4px}
.sub{margin:2px 0 8px;color:#bfd3c4;font-size:13px}
table.keys{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px;text-align:left}
table.keys td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
table.keys td:first-child{white-space:nowrap;color:#ffe9a8;font-weight:700}
.note{font-size:13px;color:#d8cfb4;margin:6px 0}
.btn{font:inherit;font-weight:900;font-size:16px;padding:10px 28px;border-radius:9px;border:2px solid #2b1d07;background:linear-gradient(#ffe08a,#e6a93a);color:#2b1d07;cursor:pointer;box-shadow:0 3px 0 #8a5a14;margin-top:8px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a14}
.link{background:none;border:none;color:#9fbfae;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:10px}
.tip{font-size:12px;color:#9fbfae;margin:8px 0 0}
.touchOnly{display:none}
body.touch .touchOnly{display:block}
body.touch .keyOnly{display:none}
@media (max-width:560px){.bars{order:3;flex-basis:100%}.lvbox{flex:1}.slot{width:38px;height:34px}}
</style>

<div id="app">
  <div id="sideL" class="side"></div>
  <div id="center">
    <div id="stage">
      <canvas id="game" aria-label="晨霧森林 遊戲畫面"></canvas>
      <div id="topbtns"><button class="mini-btn" id="helpBtn">說明</button><button class="mini-btn" id="muteBtn">音效：開</button></div>
    </div>
    <div id="hud">
      <div id="hudRow">
        <div class="lvbox"><span class="lv">Lv.<b id="lvT">1</b></span><span class="pname" id="nameT">阿嵐</span></div>
        <div class="bars">
          <div class="bar hp"><i id="hpF"></i><em>HP</em><span id="hpT">50 / 50</span></div>
          <div class="bar mp"><i id="mpF"></i><em>MP</em><span id="mpT">30 / 30</span></div>
        </div>
        <div class="slots">
          <div class="slot" id="slotSkill" title="技能：風刃斬"><span class="k">X</span><div class="wind ico">風</div><div class="cd" id="cdSkill"></div></div>
          <div class="slot" id="slotHp" title="紅色藥水"><span class="k">1</span><div class="pot r ico"></div><span class="n" id="potHp">5</span></div>
          <div class="slot" id="slotMp" title="藍色藥水"><span class="k">2</span><div class="pot b ico"></div><span class="n" id="potMp">3</span></div>
        </div>
        <div class="coins"><span class="coin"></span><span id="coinT">0</span></div>
      </div>
      <div id="expbar"><i id="expF"></i><span id="expT">EXP 0 / 15（0.00%）</span></div>
    </div>
    <div id="bottomCtl"></div>
  </div>
  <div id="sideR" class="side"></div>
</div>

<div id="dpad" class="pad">
  <span></span><button class="tb" data-act="up">▲</button><span></span>
  <button class="tb" data-act="left">◀</button><button class="tb" data-act="down">▼</button><button class="tb" data-act="right">▶</button>
</div>
<div id="acts" class="pad">
  <button class="tb" data-act="hp">紅藥</button><button class="tb" data-act="mp">藍藥</button><button class="tb" data-act="skill">技能</button>
  <button class="tb big" data-act="attack" style="grid-column:span 2">攻擊</button><button class="tb big" data-act="jump">跳躍</button>
</div>

<div id="hint" class="ov show"><div class="card">
  <h1>晨霧森林</h1>
  <p class="sub">原創 2D 橫向捲軸動作 RPG・第一階段原型</p>
  <table class="keys keyOnly">
    <tr><td>← →</td><td>移動</td></tr>
    <tr><td>↑ ↓</td><td>攀爬繩索（附近沒有繩索時，按 ↓ 趴下）</td></tr>
    <tr><td>Alt / 空白鍵</td><td>跳躍（按住 ↓ + 跳躍：從平台跳下）</td></tr>
    <tr><td>Ctrl / Z</td><td>普通攻擊</td></tr>
    <tr><td>X</td><td>技能「風刃斬」（消耗 8 MP）</td></tr>
    <tr><td>1 / 2</td><td>使用紅色藥水 / 藍色藥水</td></tr>
  </table>
  <div class="touchOnly note">使用畫面下方按鈕操作：方向鍵移動與攀爬，沒有繩索時按 ▼ 趴下，按住 ▼ 再按「跳躍」可從平台跳下。</div>
  <p class="note">怪物掉落的金幣與藥水，<b>碰觸即自動拾取</b>。</p>
  <button class="btn" id="startBtn">開始冒險</button>
  <p class="tip keyOnly">按任意鍵或點擊開始</p>
  <div><button class="link" id="resetBtn">重置進度</button></div>
</div></div>

<div id="death" class="ov"><div class="card">
  <h2>你倒下了</h2>
  <p class="note" id="deathMsg"></p>
  <button class="btn" id="respawnBtn">重生</button>
</div></div>

<script>
'use strict';
// ================= 設定與資料 =================
const WORLD_W = 3600, WORLD_H = 760, GROUND_Y = 700, TOWN_X = 190;
const STEP = 1 / 120, GRAV = 2200;
const PLAYER_NAME = '阿嵐';
const PLAYER_BASE = { hp: 50, mp: 30, atk: 12, def: 0 };
const PLAYER_GROWTH = { hp: 14, mp: 7, atk: 3, def: 0.6 };
const PHYS = { walk: 200, accel: 1900, airAccel: 900, jump: 760, climb: 140, maxFall: 1100 };
const ATTACK = { dur: 0.34, cd: 0.42, hitFrom: 0.07, hitTo: 0.2, range: 74, stabRange: 66, crit: 0.15, critMul: 1.75 };
const SKILL = { name: '風刃斬', mp: 8, cd: 1.2, mult: 1.6, speed: 720, range: 520, pierce: 3 };
const POTION = { hp: { heal: 60, name: '紅色藥水' }, mp: { heal: 40, name: '藍色藥水' }, cd: 0.5 };
// 升到下一級所需經驗（索引 = 目前等級）
const EXP_TABLE = [0, 15, 34, 57, 92, 135, 186, 250, 330, 420, 530, 660, 810, 980, 1170, 1380, 1620, 1890, 2190, 2520, 2900];
const MONSTERS = {
  moss:   { name: '綠苔蝸', lv: 1, hp: 28,  atk: 6,  def: 0, exp: 5,  speed: 28, w: 36, h: 28, ai: 'wander', coins: [2, 6],   drops: { hp: 0.06, mp: 0.04 }, respawn: 6 },
  shroom: { name: '跳跳菇', lv: 4, hp: 60,  atk: 11, def: 1, exp: 12, speed: 75, w: 32, h: 40, ai: 'hop', hopV: 470, coins: [5, 12], drops: { hp: 0.10, mp: 0.08 }, respawn: 8 },
  golem:  { name: '石甲怪', lv: 8, hp: 150, atk: 19, def: 4, exp: 30, speed: 40, chase: 95, aggro: 280, w: 46, h: 48, ai: 'chase', coins: [12, 26], drops: { hp: 0.18, mp: 0.14 }, respawn: 12 },
};
const PLATFORMS = [
  { x: 0, y: GROUND_Y, w: WORLD_W, ground: true },          // 0 地面
  { x: 500, y: 585, w: 360 }, { x: 1300, y: 585, w: 420 },   // 1,2 第一層
  { x: 2200, y: 585, w: 380 }, { x: 3000, y: 585, w: 360 },  // 3,4
  { x: 800, y: 470, w: 400 }, { x: 1750, y: 470, w: 440 },   // 5,6 第二層
  { x: 2650, y: 470, w: 400 },                               // 7
  { x: 1150, y: 355, w: 420 }, { x: 2150, y: 355, w: 420 },  // 8,9 第三層
  { x: 3100, y: 355, w: 380 },                               // 10
];
const ROPES = [
  { x: 1000, top: 470, bottom: 700 }, { x: 1480, top: 355, bottom: 585 },
  { x: 1900, top: 470, bottom: 700 }, { x: 2400, top: 355, bottom: 585 },
  { x: 2900, top: 470, bottom: 700 }, { x: 3300, top: 355, bottom: 585 },
];
const SPAWNS = [
  ['moss', 650, 0], ['moss', 950, 0], ['moss', 1450, 0], ['shroom', 1700, 0], ['moss', 2050, 0], ['shroom', 2550, 0], ['golem', 3150, 0],
  ['moss', 680, 1], ['shroom', 1420, 2], ['moss', 1620, 2], ['shroom', 2300, 3], ['shroom', 2480, 3], ['golem', 3180, 4],
  ['shroom', 900, 5], ['shroom', 1100, 5], ['shroom', 1850, 6], ['golem', 2020, 6], ['golem', 2850, 7],
  ['golem', 1300, 8], ['shroom', 1500, 8], ['golem', 2280, 9], ['golem', 2480, 9], ['golem', 3250, 10], ['shroom', 3400, 10],
].map(([type, x, plat]) => ({ type, x, plat }));
const SAVE_KEY = 'mistwood_proto_v1';
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
const OUT = '#2b1d17';

// ================= 工具 =================
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const expToNext = lv => EXP_TABLE[lv] ?? Math.round(EXP_TABLE[EXP_TABLE.length - 1] * Math.pow(1.15, lv - EXP_TABLE.length + 1));
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const $ = id => document.getElementById(id);

const cv = $('game'), ctx = cv.getContext('2d');
let VIEW_W = 960, VIEW_H = 540, SCALE = 1;

// ================= 音效 =================
let AC = null, muted = false;
try { muted = localStorage.getItem(SAVE_KEY + '_mute') === '1'; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.05, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
}
const SFX = {
  swing: () => tone(620, 0.07, 'triangle', 0.035, 240),
  hit: () => tone(240, 0.07, 'square', 0.04, 110),
  crit: () => { tone(330, 0.1, 'square', 0.05, 150); tone(900, 0.12, 'triangle', 0.035, 450, 0.02); },
  skill: () => tone(280, 0.22, 'sawtooth', 0.03, 1000),
  coin: () => { tone(988, 0.06, 'square', 0.03); tone(1319, 0.1, 'square', 0.03, null, 0.06); },
  pot: () => tone(420, 0.16, 'sine', 0.06, 900),
  jump: () => tone(300, 0.08, 'triangle', 0.025, 560),
  hurt: () => tone(190, 0.18, 'sawtooth', 0.05, 80),
  level: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.04, null, i * 0.09)),
  die: () => tone(420, 0.7, 'triangle', 0.06, 70),
  kill: () => tone(170, 0.16, 'square', 0.035, 60),
  deny: () => tone(150, 0.1, 'square', 0.03),
};

// ================= 輸入 =================
const held = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  AltLeft: 'jump', AltRight: 'jump', Space: 'jump',
  ControlLeft: 'attack', ControlRight: 'attack', KeyZ: 'attack', KeyX: 'skill',
  Digit1: 'hp', Digit2: 'mp', Numpad1: 'hp', Numpad2: 'mp',
};
function setAction(a, on) { if (on && !held[a]) pressed[a] = true; held[a] = on; }
function releaseAll() { for (const k in held) held[k] = false; document.querySelectorAll('.tb.on').forEach(b => b.classList.remove('on')); }
addEventListener('keydown', e => {
  initAudio();
  if (G.hint) { if (!e.ctrlKey && !e.metaKey) { e.preventDefault(); closeHint(); } return; }
  if (G.deathShown) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); respawn(); } return; }
  const a = KEYMAP[e.code];
  if (a) { e.preventDefault(); setAction(a, true); }
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); setAction(a, false); } });
addEventListener('blur', releaseAll);
function setupTouch() {
  document.querySelectorAll('[data-act]').forEach(b => {
    const a = b.dataset.act;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); initAudio();
      try { b.setPointerCapture(e.pointerId); } catch (err) {}
      setAction(a, true); b.classList.add('on');
    });
    const off = () => { setAction(a, false); b.classList.remove('on'); };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, off));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
}

// ================= 遊戲狀態 =================
const G = {
  player: null, monsters: [], drops: [], projs: [], parts: [], texts: [], toasts: [],
  cam: { x: 0, y: 0 }, shake: 0, time: 0, lvlFx: 0, banner: null, intro: 0,
  hint: true, deathShown: false, saveT: 0, started: false,
};

function recalcStats(p) {
  p.maxHp = Math.round(PLAYER_BASE.hp + PLAYER_GROWTH.hp * (p.lv - 1));
  p.maxMp = Math.round(PLAYER_BASE.mp + PLAYER_GROWTH.mp * (p.lv - 1));
  p.atk = Math.round(PLAYER_BASE.atk + PLAYER_GROWTH.atk * (p.lv - 1));
  p.def = Math.floor(PLAYER_BASE.def + PLAYER_GROWTH.def * (p.lv - 1));
}
function makePlayer(d) {
  d = d || {};
  const num = (v, def) => (typeof v === 'number' && isFinite(v)) ? v : def;
  const p = {
    x: TOWN_X, y: GROUND_Y, vx: 0, vy: 0, w: 22, h: 50, face: 1, onGround: false, plat: null, rope: null, ropeCD: 0,
    lv: clamp(Math.floor(num(d.lv, 1)), 1, 200), exp: Math.max(0, num(d.exp, 0)), coins: Math.max(0, Math.floor(num(d.coins, 0))),
    pots: { hp: Math.max(0, Math.floor(num(d.pots && d.pots.hp, 5))), mp: Math.max(0, Math.floor(num(d.pots && d.pots.mp, 3))) },
    inv: 0, hurtT: 0, atkT: 0, atkCD: 0, atkKind: 'melee', swing: 0, skillCD: 0, potCD: 0, dropT: 0, dropPlat: null,
    anim: 0, dead: false, deadT: 0, expLoss: 0, prone: false,
  };
  recalcStats(p);
  p.hp = clamp(Math.round(num(d.hp, p.maxHp)), 0, p.maxHp);
  p.mp = clamp(Math.round(num(d.mp, p.maxMp)), 0, p.maxMp);
  if (typeof d.x === 'number' && typeof d.y === 'number') { p.x = clamp(d.x, 12, WORLD_W - 12); p.y = clamp(d.y, 200, GROUND_Y); p.face = d.face === -1 ? -1 : 1; }
  if (p.hp <= 0) { p.hp = Math.ceil(p.maxHp / 2); p.x = TOWN_X; p.y = GROUND_Y; }
  return p;
}
function makeMonster(sp) {
  const d = MONSTERS[sp.type], plat = PLATFORMS[sp.plat];
  let minX, maxX;
  if (plat.ground) { minX = Math.max(480, sp.x - 230); maxX = Math.min(WORLD_W - 30, sp.x + 230); }
  else { minX = plat.x + d.w / 2 + 2; maxX = plat.x + plat.w - d.w / 2 - 2; }
  return {

function updatePlayer(dt) {

  p.atkCD = Math.max(0, p.atkCD - dt); p.skillCD = Math.max(0, p.skillCD - dt);

    if (p.rope) return;
  }
  if (p.ropeCD <= 0 && p.hurtT <= 0 && p.atkT <= 0) {

  if (G.shake > 0) { sx = rand(-1, 1) * G.shake; sy = rand(-1, 1) * G.shake; }
  const cx = G.cam.x, cy = G.cam.y;
  ctx.save(); ctx.translate(-cx + sx, -cy + sy);
  const tx = Math.max(0, Math.floor(cx) - 2), ty = Math.max(0, Math.floor(cy) - 2);
  const tw = Math.min(WORLD_W - tx, VIEW_W + 6), th = Math.min(WORLD_H - ty, VIEW_H + 6);
  if (terrain) ctx.drawImage(terrain, tx, ty, tw, th, tx, ty, tw, th);
  // 村莊招牌
  ctx.fillStyle = '#6b4a2f'; ctx.fillRect(338, GROUND_Y - 58, 6, 58);
  shape('#c9a46a', () => rr(306, GROUND_Y - 70, 72, 26, 4), 2, '#3a2516');
  ctx.textAlign = 'center'; ctx.font = `800 13px ${FONT}`; ctx.fillStyle = '#3a2516'; ctx.fillText('晨霧村 ▶ 森林', 342, GROUND_Y - 52);
  drawDrops();
  for (const m of G.monsters) drawMonster(m);
  drawLevelFx();
  drawPlayer();
  drawProjs();
  drawParts();
  drawTexts();
  ctx.restore();
  if (!reduceMotion) {
    ctx.fillStyle = 'rgba(250,244,236,.08)';
    for (let i = 0; i < 3; i++) { const x = ((G.time * (12 + i * 6) - cx * 0.9 + i * 600) % (VIEW_W + 600) + VIEW_W + 600) % (VIEW_W + 600) - 300; ctx.beginPath(); ctx.ellipse(x, VIEW_H - 30 - i * 40, 260, 26, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  drawMinimap();
  drawToasts();
  drawBanners();
}

// ================= HUD（DOM） =================
const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function setW(id, f) { const v = (clamp(f, 0, 1) * 100).toFixed(1) + '%'; if (hudCache[id] !== v) { hudCache[id] = v; $(id).style.width = v; } }
function setCls(id, cls, on) { const k = id + cls; if (hudCache[k] !== on) { hudCache[k] = on; $(id).classList.toggle(cls, on); } }
function updateHud() {
  const p = G.player; if (!p) return;
  setText('lvT', String(p.lv)); setText('nameT', PLAYER_NAME);
  setText('hpT', `${Math.ceil(p.hp)} / ${p.maxHp}`); setW('hpF', p.hp / p.maxHp);
  setText('mpT', `${Math.ceil(p.mp)} / ${p.maxMp}`); setW('mpF', p.mp / p.maxMp);
  const need = expToNext(p.lv);
  setText('expT', `EXP ${p.exp} / ${need}（${(p.exp / need * 100).toFixed(2)}%）`); setW('expF', p.exp / need);
  setText('coinT', p.coins.toLocaleString());
  setText('potHp', String(p.pots.hp)); setText('potMp', String(p.pots.mp));
  const cdv = (p.skillCD > 0 ? p.skillCD / SKILL.cd : 0).toFixed(3);
  if (hudCache.cd !== cdv) { hudCache.cd = cdv; $('cdSkill').style.setProperty('--p', cdv); }
  setCls('slotSkill', 'lack', p.mp < SKILL.mp);
  setCls('slotHp', 'lack', p.pots.hp <= 0); setCls('slotMp', 'lack', p.pots.mp <= 0);
}

// ================= 版面配置 =================
let isTouch = false;
function enableTouch() { if (isTouch) return; isTouch = true; document.body.classList.add('touch'); layout(); }
function layout() {
  const W = document.documentElement.clientWidth || innerWidth, H = document.documentElement.clientHeight || innerHeight;
  const land = isTouch && W > H && W >= 560;
  const dpad = $('dpad'), acts = $('acts');
  const tl = land ? $('sideL') : $('bottomCtl'), tr = land ? $('sideR') : $('bottomCtl');
  if (dpad.parentNode !== tl) tl.appendChild(dpad);
  if (acts.parentNode !== tr) tr.appendChild(acts);
  $('sideL').style.display = $('sideR').style.display = land ? 'flex' : 'none';
  $('bottomCtl').style.display = isTouch && !land ? 'flex' : 'none';
  dpad.style.display = acts.style.display = isTouch ? 'grid' : 'none';
  const sideW = land ? $('sideL').offsetWidth + $('sideR').offsetWidth : 0;
  const availW = Math.max(200, Math.min(W - sideW, 1500));
  const hud = $('hud'), ctl = $('bottomCtl');
  hud.style.width = availW + 'px'; ctl.style.width = availW + 'px';
  const ctlH = isTouch && !land ? ctl.offsetHeight : 0;
  let availH = Math.max(120, H - hud.offsetHeight - ctlH);
  const wide = availW / availH > 1.5, small = availW < 720;
  const ow = VIEW_W, oh = VIEW_H;
  VIEW_W = wide ? (small ? 640 : 960) : (small ? 560 : 800);
  VIEW_H = wide ? VIEW_W * 9 / 16 : VIEW_W * 3 / 4;
  let cw = availW, ch = cw * VIEW_H / VIEW_W;
  if (ch > availH) { ch = availH; cw = ch * VIEW_W / VIEW_H; }
  hud.style.width = Math.floor(cw) + 'px';
  const availH2 = Math.max(120, H - hud.offsetHeight - ctlH);
  if (ch > availH2) { ch = availH2; cw = ch * VIEW_W / VIEW_H; hud.style.width = Math.floor(cw) + 'px'; }
  cw = Math.floor(cw); ch = Math.floor(ch);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  SCALE = cv.width / VIEW_W;
  if (G.player && (ow !== VIEW_W || oh !== VIEW_H)) updateCamera(0, true);
}

// ================= 存檔 =================
function saveState() {
  const p = G.player;
  if (!p) return {};
  return { player: { lv: p.lv, exp: p.exp, hp: p.dead ? 0 : p.hp, mp: p.mp, coins: p.coins, pots: { hp: p.pots.hp, mp: p.pots.mp }, x: p.x, y: p.y, face: p.face }, hintSeen: !G.hint };
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveState())); } catch (e) {} }
function loadLocal() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

// ================= 介面事件 =================
function closeHint() {
  if (!G.hint) return;
  G.hint = false; $('hint').classList.remove('show'); initAudio(); releaseAll();
  if (G.intro === 0 && !G.introShown) { G.intro = 3.6; G.introShown = true; }
}
function openHint() { G.hint = true; releaseAll(); $('hint').classList.add('show'); }
function updateMuteBtn() { $('muteBtn').textContent = muted ? '音效：關' : '音效：開'; }
function setupUI() {
  $('startBtn').addEventListener('click', e => { e.stopPropagation(); closeHint(); });
  $('hint').addEventListener('click', e => { if (e.target.id !== 'resetBtn') closeHint(); });
  $('resetBtn').addEventListener('click', e => {
    e.stopPropagation();
    try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
    G.player = makePlayer({}); G.drops = []; G.projs = []; G.monsters = SPAWNS.map(makeMonster);
    updateCamera(0, true); $('resetBtn').textContent = '已重置進度';
  });
  $('helpBtn').addEventListener('click', e => { e.currentTarget.blur(); openHint(); });
  $('muteBtn').addEventListener('click', e => {
    initAudio(); muted = !muted; updateMuteBtn(); e.currentTarget.blur();
    try { localStorage.setItem(SAVE_KEY + '_mute', muted ? '1' : '0'); } catch (err) {}
  });
  $('respawnBtn').addEventListener('click', respawn);
  updateMuteBtn();
  setupTouch();
  addEventListener('resize', layout);
  addEventListener('orientationchange', () => setTimeout(layout, 150));
  addEventListener('touchstart', enableTouch, { passive: true, once: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); persist(); } last = 0; });
  addEventListener('pagehide', persist);
}

// ================= 主迴圈 =================
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (!G.hint && !document.hidden) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 24) { update(STEP); acc -= STEP; n++; for (const k in pressed) pressed[k] = false; }
    if (n >= 24) acc = 0;
  } else { acc = 0; for (const k in pressed) pressed[k] = false; }
  render();
  updateHud();
}

// ================= 啟動 =================
function start(data) {
  if (G.started) return;
  G.started = true;
  data = data || {};
  const saved = data.player ? data : loadLocal();
  G.player = makePlayer(saved && saved.player);
  G.monsters = SPAWNS.map(makeMonster);
  terrain = buildTerrain();
  try { if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) { isTouch = true; document.body.classList.add('touch'); } } catch (e) {}
  setupUI();
  layout();
  updateCamera(0, true);
  if (data.hintSeen) { G.hint = false; $('hint').classList.remove('show'); G.introShown = true; }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => saveState());
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
